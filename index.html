<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pila & Cola — Estructuras de Datos</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <header>
    <h1>Estructuras de Datos</h1>
    <p class="subtitle">Pila (Stack) &amp; Cola (Queue)</p>
  </header>

  <main>

    <!-- ========== PILA ========== -->
    <section class="card" id="stack-section">
      <div class="card-header">
        <span class="tag">LIFO</span>
        <h2>🥞 Pila <span class="mono">(Stack)</span></h2>
      </div>

      <div class="controls">
        <input type="text" id="stack-input" placeholder="Valor a insertar..." maxlength="12"/>
        <button class="btn btn-push" onclick="pushStack()">Push ↑</button>
        <button class="btn btn-pop"  onclick="popStack()">Pop ↓</button>
      </div>

      <div class="structure-wrap">
        <div class="label-side">TOP ↑</div>
        <div class="structure" id="stack-display">
          <div class="empty-msg">Pila vacía</div>
        </div>
        <div class="label-side">BASE ↓</div>
      </div>

      <div class="log" id="stack-log">
        <span class="log-title">Historial de operaciones</span>
      </div>
    </section>

    <!-- ========== COLA ========== -->
    <section class="card" id="queue-section">
      <div class="card-header">
        <span class="tag tag-queue">FIFO</span>
        <h2>🚌 Cola <span class="mono">(Queue)</span></h2>
      </div>

      <div class="controls">
        <input type="text" id="queue-input" placeholder="Valor a insertar..." maxlength="12"/>
        <button class="btn btn-enqueue" onclick="enqueue()">Enqueue →</button>
        <button class="btn btn-dequeue" onclick="dequeue()">Dequeue ←</button>
      </div>

      <div class="structure-wrap horizontal">
        <div class="label-side">FRONT ←</div>
        <div class="structure horizontal" id="queue-display">
          <div class="empty-msg">Cola vacía</div>
        </div>
        <div class="label-side">REAR →</div>
      </div>

      <div class="log" id="queue-log">
        <span class="log-title">Historial de operaciones</span>
      </div>
    </section>

  </main>

  <footer>
    <p>Actividad — Git &amp; Trabajo en Equipo · Estructuras de Datos</p>
  </footer>

  <script src="stack.js"></script>
  <script src="queue.js"></script>
  <script src="ui.js"></script>
</body>
</html>
